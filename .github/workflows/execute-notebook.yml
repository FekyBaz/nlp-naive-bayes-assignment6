name: Execute NLP Assignment Notebook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute notebook
        run: |
          jupyter nbconvert --to notebook --execute assignment_1.ipynb --output assignment_1_executed.ipynb --ExecutePreprocessor.timeout=300

      - name: Validate executed notebook and report
        run: |
          python scripts/validate_notebook.py assignment_1_executed.ipynb

      - name: Verify report generator
        run: |
          python report/generate_report.py

      - name: Upload executed notebook and report
        uses: actions/upload-artifact@v4
        with:
          name: executed-nlp-assignment-notebook
          path: |
            assignment_1_executed.ipynb
            report/report.pdf
          if-no-files-found: error
          retention-days: 7
